<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Shield Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Inner Subtle Hex Border -->
  <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Barbell Plates Left -->
  <rect x="12" y="24" width="4" height="16" rx="2" fill="url(#neonGrad)" />
  <rect x="18" y="20" width="3.5" height="24" rx="1.75" fill="url(#neonGrad)" />

  <!-- Barbell Bar -->
  <rect x="12" y="30.5" width="40" height="3" rx="1.5" fill="#f8fafc" />

  <!-- Barbell Plates Right -->
  <rect x="42.5" y="20" width="3.5" height="24" rx="1.75" fill="url(#neonGrad)" />
  <rect x="48" y="24" width="4" height="16" rx="2" fill="url(#neonGrad)" />

  <!-- Central Intelligence AI Core Node -->
  <circle cx="32" cy="32" r="6" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8" />

  <!-- Top Pulse Ray -->
  <path d="M 32 14 L 32 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Pulse Ray -->
  <path d="M 32 44 L 32 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
